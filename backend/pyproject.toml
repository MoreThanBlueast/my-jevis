[project]
name = "open-jevis-backend"
version = "0.1.0"
description = "Task platform for a non-intrusive Android agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30.0",
  "email-validator>=2.2.0",
  "fastapi>=0.116.0",
  "pydantic-settings>=2.10.0",
  "redis>=6.2.0",
  "sqlalchemy[asyncio]>=2.0.41",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.2.0,<0.3"]

[dependency-groups]
dev = [
  "aiosqlite>=0.21.0",
  "httpx>=0.28.1",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
